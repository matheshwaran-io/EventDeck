"normal" text-anchor="middle" dominant-baseline="middle">(campus, institution)</text><text x="205.0" y="702.65" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ticket validity</text><text x="205.0" y="727.35" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">payment success</text><text x="950" y="1440.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Every page, Server Action and route handler repeats these checks; the proxy only redirects.</text></svg>