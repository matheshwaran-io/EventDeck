<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1510" viewBox="0 0 2000 1510"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F4A5C"/></marker></defs><rect width="2000" height="1510" fill="#FFFFFF"/><rect x="640" y="30" width="720" height="100" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="3"/><text x="1000.0" y="79.895" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Scan: QR from camera, or a typed ticket number</text><rect x="420" y="190" width="1000" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="920.0" y="233.69" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">assertCanScanEvent(actor, event)</text><text x="920.0" y="273.25" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">admin · owner · active moderator of this event</text><rect x="1530" y="202" width="430" height="101" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1745.0" y="252.41" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">403 — not allowed to scan</text><polyline points="1420,252.5 1530,252.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1458.99" y="217.75" width="32.019999999999996" height="25.5" fill="#FFFFFF"/><text x="1475" y="230.5" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no</text><rect x="420" y="370" width="1000" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="920.0" y="413.69" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">parseScan(raw)</text><text x="920.0" y="453.25" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">accepts EVD1:&lt;token&gt;, a raw token or a ticket number</text><rect x="1530" y="382" width="430" height="101" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1745.0" y="432.41" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Invalid — not a ticket from this system</text><polyline points="1420,432.5 1530,432.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1458.99" y="397.75" width="32.019999999999996" height="25.5" fill="#FFFFFF"/><text x="1475" y="410.5" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no</text><rect x="420" y="550" width="1000" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="920.0" y="593.6899999999999" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Look up the ticket in the database</text><text x="920.0" y="633.25" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">join tickets → ticket_tiers → bookings</text><rect x="1530" y="562" width="430" height="101" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1745.0" y="612.41" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Invalid — ticket not found / other event</text><polyline points="1420,612.5 1530,612.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1458.99" y="577.75" width="32.019999999999996" height="25.5" fill="#FFFFFF"/><text x="1475" y="590.5" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no</text><rect x="420" y="730" width="1000" height="150" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="920.0" y="774.49" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Check every gate</text><text x="920.0" y="814.0500000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">event not cancelled · ticket valid · booking approved</text><text x="920.0" y="837.45" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">payment paid or not required</text><rect x="1530" y="742" width="430" height="126" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1745.0" y="804.91" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Invalid — reason shown, audit row written</text><polyline points="1420,805.0 1530,805.0" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1458.99" y="770.25" width="32.019999999999996" height="25.5" fill="#FFFFFF"/><text x="1475" y="783.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no</text><rect x="420" y="935" width="1000" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="920.0" y="978.6899999999999" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Inside the check-in window?</text><text x="920.0" y="1018.25" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">checkin_opens_at ≤ now ≤ checkin_closes_at</text><rect x="1530" y="947" width="430" height="101" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1745.0" y="997.41" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Not open yet / closed</text><polyline points="1420,997.5 1530,997.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1458.99" y="962.75" width="32.019999999999996" height="25.5" fill="#FFFFFF"/><text x="1475" y="975.5" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no</text><rect x="420" y="1115" width="1000" height="125" rx="18" fill="#F0EBF8" stroke="#6B4FA0" stroke-width="3"/><text x="920.0" y="1158.69" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">INSERT INTO check_ins … ON CONFLICT (ticket_id) DO NOTHING</text><text x="920.0" y="1198.25" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">the UNIQUE ticket_id makes the first scan win, on any device</text><polyline points="920,130 920,190" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="920,315 920,370" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="920,495 920,550" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="920,675 920,730" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="920,880 920,935" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="920,1060 920,1115" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="420" y="1330" width="460" height="130" rx="18" fill="#EAF4EA" stroke="#3C7A3C" stroke-width="3"/><text x="650.0" y="1364.49" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Row inserted</text><text x="650.0" y="1404.05" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">✓ Checked in — attendee,</text><text x="650.0" y="1427.45" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">tier and ticket number</text><rect x="960" y="1330" width="460" height="130" rx="18" fill="#FDF3E1" stroke="#B7791F" stroke-width="3"/><text x="1190.0" y="1376.19" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Row already exists</text><text x="1190.0" y="1415.75" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Already used — by whom, when</text><polyline points="650,1240 650,1330" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="1190,1240 1190,1330" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="40" y="190" width="300" height="380" rx="18" fill="#FDF3E1" stroke="#B7791F" stroke-width="3"/><text x="190.0" y="289.57" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Trusted from</text><text x="190.0" y="315.82" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">the QR code</text><text x="190.0" y="354.75" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">only a 192-bit</text><text x="190.0" y="378.15" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">random token</text><text x="190.0" y="401.55" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="190.0" y="424.95" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">everything else is</text><text x="190.0" y="448.35" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">read from the</text><text x="190.0" y="471.75" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">database</text></svg>