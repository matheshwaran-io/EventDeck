" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">or admin</text><text x="595.0" y="1034.925" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(edit, verify,</text><text x="595.0" y="1057.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">reports, team)</text><rect x="785" y="890" width="330" height="230" rx="12" fill="#FFFFFF" stroke="#3F4A5C" stroke-width="3"/><text x="950.0" y="953.7049999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">assertCanScanEvent</text><text x="950.0" y="990.7249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">admin, owner, or an</text><text x="950.0" y="1012.8249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">active moderator of</text><text x="950.0" y="1034.925" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">this event; checked</text><text x="950.0" y="1057.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">on every scan</text><rect x="1140" y="890" width="330" height="230" rx="12" fill="#FFFFFF" stroke="#3F4A5C" stroke-width="3"/><text x="1305.0" y="953.7049999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Ownership checks</text><text x="1305.0" y="990.7249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">booking, ticket PDF,</text><text x="1305.0" y="1012.8249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">payment order: owner,</text><text x="1305.0" y="1034.925" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">event organizer</text><text x="1305.0" y="1057.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">or admin</text><rect x="500" y="1220" width="900" height="150" rx="18" fill="#EAF4EA" stroke="#3C7A3C" stroke-width="3"/><text x="950.0" y="1263.185" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Supabase PostgreSQL</text><text x="950.0" y="1304.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Row-Level Security on every table · CHECK / UNIQUE constraints</text><text x="950.0" y="1328.725" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">direct API calls with a user token see only that user's rows</text><polyline points="950,130 950,190" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="950,340 950,400" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="950,550 950,610" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="950,760 950,820" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="950,1150 950,1220" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1560" y="215" width="380" height="100" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1750.0" y="252.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Signed out →</text><text x="1750.0" y="277.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">/login?next=…</text><rect x="1560" y="425" width="380" height="100" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1750.0" y="462.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Treated as</text><text x="1750.0" y="487.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">signed out</text><rect x="1560" y="635" width="380" height="100" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1750.0" y="672.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Page → /forbidden</text><text x="1750.0" y="697.4" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">API → 401 / 403</text><rect x="1560" y="935" width="380" height="140" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1750.0" y="981.155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Refused: 403, or</text><text x="1750.0" y="1004.905" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" font-weight="normal" text-anchor="middle" dominant-baseline="middle">404 so another 