<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1880" viewBox="0 0 2000 1880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F4A5C"/></marker></defs><rect width="2000" height="1880" fill="#FFFFFF"/><rect x="380" y="30" width="980" height="125" rx="18" fill="#FFFFFF" stroke="#3F4A5C" stroke-width="3"/><text x="870.0" y="73.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1.  Idempotency check</text><text x="870.0" y="113.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">same (user, idempotency key) → return the existing booking</text><rect x="380" y="205" width="980" height="125" rx="18" fill="#FFFFFF" stroke="#3F4A5C" stroke-width="3"/><text x="870.0" y="248.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2.  Release expired holds</text><text x="870.0" y="288.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">expireHolds({ eventId }) frees unpaid seats after 10 minutes</text><rect x="380" y="380" width="980" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="423.03499999999997" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3.  BEGIN — lock rows</text><text x="870.0" y="463.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">profile FOR UPDATE (serialises this user) · event FOR SHARE</text><rect x="380" y="555" width="980" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="598.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4.  Event and eligibility rules</text><text x="870.0" y="638.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">published · registration open · checkEligibility(stored profile)</text><rect x="380" y="730" width="980" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="773.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">5.  Price on the server</text><text x="870.0" y="813.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">priceOrder(lines, tiers from DB, min(event limit, 4))</text><rect x="380" y="905" width="980" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="948.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6.  Per-person limit</text><text x="870.0" y="988.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">tickets already held + new tickets ≤ limit</text><rect x="380" y="1080" width="980" height="150" rx="18" fill="#F0EBF8" stroke="#6B4FA0" stroke-width="3"/><text x="870.0" y="1123.185" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7.  Reserve seats atomically</text><text x="870.0" y="1164.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">UPDATE ticket_tiers SET allocated = allocated + n</text><text x="870.0" y="1188.725" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">WHERE allocated + n &lt;= capacity   (tiers in sorted order)</text><rect x="380" y="1280" width="980" height="150" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="1323.185" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">8.  Insert booking + items</text><text x="870.0" y="1364.0249999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">paid → awaiting_payment (10-min hold) · free → approved</text><text x="870.0" y="1388.725" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">complimentary → pending_verification</text><rect x="380" y="1480" width="980" height="125" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="870.0" y="1523.035" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">9.  Tickets, audit, notifications</text><text x="870.0" y="1563.875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">free: issue tickets now · audit row · notify user and organizer</text><rect x="380" y="1655" width="980" height="90" rx="18" fill="#EAF4EA" stroke="#3C7A3C" stroke-width="3"/><text x="870.0" y="1699.885" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">COMMIT</text><polyline points="870,155 870,205" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,330 870,380" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,505 870,555" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,680 870,730" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,855 870,905" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,1030 870,1080" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,1230 870,1280" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,1430 870,1480" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><polyline points="870,1605 870,1655" fill="none" stroke="#3F4A5C" stroke-width="2.6" marker-end="url(#a)"/><rect x="1500" y="560" width="440" height="620" rx="18" fill="#FDECEC" stroke="#B42318" stroke-width="3"/><text x="1720.0" y="745.885" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ROLLBACK</text><text x="1720.0" y="786.075" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">DomainError →</text><text x="1720.0" y="809.475" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">friendly message:</text><text x="1720.0" y="832.875" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="1720.0" y="856.2750000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">“registration has closed”</text><text x="1720.0" y="879.6750000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">“not eligible …”</text><text x="1720.0" y="903.075" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">“limit is 4 per person”</text><text x="1720.0" y="926.475" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">“not enough tickets</text><text x="1720.0" y="949.875" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">left in that tier”</text><text x="1720.0" y="973.2750000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="1720.0" y="996.6750000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">nothing is written</text><polyline points="1360,617.5 1500,617.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" stroke-dasharray="10 8" marker-end="url(#a)"/><polyline points="1360,792.5 1500,792.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" stroke-dasharray="10 8" marker-end="url(#a)"/><polyline points="1360,967.5 1500,967.5" fill="none" stroke="#3F4A5C" stroke-width="2.6" stroke-dasharray="10 8" marker-end="url(#a)"/><polyline points="1360,1155.0 1500,1155.0" fill="none" stroke="#3F4A5C" stroke-width="2.6" stroke-dasharray="10 8" marker-end="url(#a)"/><rect x="40" y="30" width="280" height="270" rx="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/><text x="180.0" y="121.36999999999999" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Before the</text><text x="180.0" y="147.62" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">transaction</text><text x="180.0" y="186.54999999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">cheap checks,</text><text x="180.0" y="209.95" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">no locks held</text><text x="870" y="1805.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">A duplicate idempotency key or a CHECK violation raised by the database is mapped to the same results.</text></svg>