<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F4A5C"/></marker></defs><rect width="2000" height="1500" fill="#FFFFFF"/><rect x="650" y="30" width="600" height="100" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="3"/><text x="950.0" y="79.885" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Request from a browser</text><rect x="500" y="190" width="900" height="150" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="950.0" y="233.185" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Edge proxy — src/proxy.ts</text><text x="950.0" y="274.02500000000003" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">refreshes the session cookie</text><text x="950.0" y="298.725" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">protected prefixes: /my · /organizer · /admin · /moderate</text><rect x="500" y="400" width="900" height="150" rx="18" fill="#E9F0FA" stroke="#2F4F8F" stroke-width="3"/><text x="950.0" y="443.185" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" font-weight="bold" text-anchor="middle" dominant-baseline="middle">getCurrentUser() — src/lib/auth.ts</text><text x="950.0" y="484.02500000000003" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6B7280" font-weight="normal" text-anchor="middle" dominant-baseline="middle">verifies the session with Supabase Auth (getUser)</text><text x="950.0" y="508.725" font-family="Arial, Helvetica, sans-serif" 